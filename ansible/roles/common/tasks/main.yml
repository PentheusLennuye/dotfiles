---
- name: linux setup
  become: true
  block:
    - import_tasks: packages.yaml
    - import_tasks: configurations.yaml
    - name: Debian SSH service started
      when: ansible_facts["os_family"] == "Archlinux"
      ansible.builtin.service:
        name: sshd
        enabled: true
        state: started
    - name: Debian SSH service started
      when: ansible_facts["os_family"] == "Debian"
      ansible.builtin.service:
        name: ssh
        enabled: true
        state: started
