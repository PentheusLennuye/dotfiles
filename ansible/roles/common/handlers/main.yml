---
- name: Install CA Arch
  ansible.builtin.shell:
    cmd: update-ca-trust

- name: Install CA Debian
  ansible.builtin.shell:
    cmd: update-ca-certificates

- name: Restart SSH Service
  block:
    - name: Restart SSH ArchLinux
      when: ansible_facts["os_family"] == "Archlinux" and "laptops" not in group_names
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart SSH Debian
      when: ansible_facts["os_family"] == "Debian"
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart Resolved Service
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
