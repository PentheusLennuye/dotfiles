---
- name: Common Configuration
  when: ansible_os_family == "Debian" or ansible_os_family == "ArchLinux"
  block:
    - name: Kerberos configuration
      ansible.builtin.template:
        src: templates/krb5.conf.j2
        dest: /etc/krb5.conf
        mode: "0644"
        owner: root
        group: root
  tags:
    - domain-client
