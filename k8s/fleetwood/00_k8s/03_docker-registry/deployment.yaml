---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-registry
  template:
    metadata:
      labels:
        app: docker-registry
    spec:
      affinity:
        # Ensure that the pods are not bunched into the same node.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: docker-registry
                topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: docker-registry-data
          persistentVolumeClaim:
            claimName: docker-registry-nfs-pvc
      containers:
        - name: docker-registry
          env:
            - name: REGISTY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: Registry
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          image: registry:3
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: docker-registry-data
              readOnly: false
              mountPath: /data
            - name: docker-registry-data
              readOnly: true
              mountPath: /auth/htpasswd
              subPath: htpasswd
