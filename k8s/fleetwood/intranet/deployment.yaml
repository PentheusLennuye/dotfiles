apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: intranet
  name: intranet
  namespace: family
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intranet
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: intranet
    spec:
      volumes:
        - name: intranet-html
          persistentVolumeClaim:
            claimName: intranet-nfs-pvc
      containers:
        - image: nginx:1.29.7-alpine
          name: nginx
          resources: {}
          volumeMounts:
            - name: intranet-html
              mountPath: /usr/share/nginx/html
              readOnly: true
