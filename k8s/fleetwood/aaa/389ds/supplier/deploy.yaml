---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: ldap
  name: ldap
  namespace: it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ldap
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ldap
                topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: ca-anchors
          configMap:
            name: 389ds-ca-cert
        - name: dirsrv-startup
          emptyDir: {}
        - name: merged-certs
          emptyDir: {}
        - name: 389ds-data
          persistentVolumeClaim:
            claimName: 389ds-nfs-pvc
        - name: 389ds-tls
          secret:
            secretName: 389ds-tls
            items:
              - key: "server.key"
                path: "server.key"
              - key: "server.crt"
                path: "server.crt"
              - key: "ca.crt"
                path: "ca/ca.crt"
      initContainers:
        - name: init-ca
          image: 389ds/dirsrv:3.1
          command: ["sh", "-c"]
          args:
            - |
              cp /anchors/cummings-online.ca.crt /etc/pki/trust/anchors
              update-ca-certificates
              cp /var/lib/ca-certificates/ca-bundle.pem /merged-certs/ca-bundle.pem
              echo "KRB5_KTNAME=/etc/dirsrv/ds.keytab; export KRB5_KTNAME" > /dirsrv_startup/dirsrv
          volumeMounts:
            - name: ca-anchors
              mountPath: /anchors
              readOnly: true
            - name: merged-certs
              mountPath: /merged-certs
            - name: dirsrv-startup
              mountPath: /dirsrv_startup
            - name: 389ds-data
              readOnly: false
              mountPath: /data
            - name: 389ds-tls
              readOnly: true
              mountPath: /data/tls
      containers:
        - name: dirsrv
          env:
            - name: DS_DM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ds-dm-password
                  key: password
            - name: DS_SUFFIX_NAME
              value: "dc=cummings-online,dc=ca"
            - name: DS_REINDEX
              value: "true"
          image: 389ds/dirsrv:3.1
          ports:
            - containerPort: 3389
            - containerPort: 3636
          volumeMounts:
            - name: 389ds-data
              readOnly: true
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
            - name: 389ds-data
              readOnly: false
              mountPath: /etc/dirsrv/ds.keytab
              subPath: ds.keytab
            - name: 389ds-data
              readOnly: false
              mountPath: /data
            - name: 389ds-tls
              readOnly: true
              mountPath: /data/tls
            - name: dirsrv-startup
              mountPath: /etc/sysconfig/dirsrv
              subPath: dirsrv
              readOnly: true
            - name: merged-certs
              mountPath: /var/lib/ca-certificates/ca-bundle.pem
              subPath: ca-bundle.pem
              readOnly: true
