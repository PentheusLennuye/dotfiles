---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: 389ds-local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer


# ───── Config ───────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: 389ds-local-config-pv
spec:
  capacity:
    storage: 15Mi
  accessModes:
    - ReadWriteOncePod
  persistentVolumeReclaimPolicy: Retain
  storageClassName: 389ds-local-storage
  local:
    path: /srv/k8s/389ds/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - jigen
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 389ds-config-pvc
  namespace: it
spec:
  accessModes:
    - ReadWriteOncePod
  storageClassName: 389ds-local-storage
  resources:
    requests:
      storage: 15Mi


