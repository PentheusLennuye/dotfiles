---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: 389ds-nfs-pv
  labels:
    type: nfs-model-storage
spec:
  capacity:
    storage: 50Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nconnect=8
  nfs:
    server: jigen
    path: /protected/fleetwood/389ds
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 389ds-nfs-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Mi
  selector:
    matchLabels:
      type: nfs-model-storage
  storageClassName: ""
