---
apiVersion: v1
kind: Service
metadata:
  name: ldap
  namespace: it
spec:
  selector:
    app: ldap
  ports:
    - name: ldap
      protocol: TCP
      port: 389
      targetPort: 3389
    - name: ldaps
      protocol: TCP
      port: 636
      targetPort: 3636
  type: LoadBalancer
  loadBalancerIP: 10.11.0.11
