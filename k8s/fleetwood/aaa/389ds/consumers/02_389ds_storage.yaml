---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: 389ds-nfs2-pv
spec:
  capacity:
    storage: 50Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nconnect=8
  nfs:
    server: lupin
    path: /protected/fleetwood/389ds
  storageClassName: ldap-secondary
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 389ds-nfs2-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Mi
  storageClassName: ldap-secondary
