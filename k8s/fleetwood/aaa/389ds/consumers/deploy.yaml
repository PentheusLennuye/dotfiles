---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: ldap-replica
  name: ldap-replica
  namespace: it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap-replica
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: ldap-replica
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ldap-replica
                topologyKey: "kubernetes.io/hostname"
      volumes:
        - name: 389ds-consumer-data
          persistentVolumeClaim:
            claimName: 389ds-nfs2-pvc
        - name: 389ds-consumer-tls
          secret:
            secretName: 389ds-consumer-tls
            items:
              - key: "server.key"
                path: "server.key"
              - key: "server.crt"
                path: "server.crt"
              - key: "ca.crt"
                path: "ca/ca.crt"
      imagePullSecrets:
        - name: regcred
      containers:
        - name: dirsrv
          env:
            - name: DS_DM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ds-dm-password
                  key: password
            - name: DS_SUFFIX_NAME
              value: "dc=cummings-online,dc=ca"
            - name: HOST_FQDN
              value: "ldap1.cummings-online.ca"
            - name: REPLICATION_ROLE
              value: consumer
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ds-dm-password
                  key: password
            - name: REPLICATION_PEERS
              value: "(ldap.cummings-online.ca:fleetwood-agreement-ldap1)"
          image: docker.cummings-online.ca/389ds:0.2.12
          imagePullPolicy: Always
          ports:
            - containerPort: 389
            - containerPort: 636
          volumeMounts:
            - name: 389ds-consumer-data
              readOnly: true
              mountPath: /etc/krb5.conf
              subPath: krb5.conf
            - name: 389ds-consumer-data
              readOnly: false
              mountPath: /etc/dirsrv/ds.keytab
              subPath: ds.keytab
            - name: 389ds-consumer-data
              readOnly: false
              mountPath: /data
            - name: 389ds-consumer-tls
              readOnly: true
              mountPath: /data/tls
