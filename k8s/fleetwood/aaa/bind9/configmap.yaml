---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bind-config
  namespace: it
data:
  config: |
    acl bad_networks { };
    acl cluster { 10.42.0.0/16; };
    acl nodes { 10.11.0.0/24; 172.16.73.0/24; };
    acl secondaries { 192.168.73.31; };
    acl trusted {
      10.0.0.0/24;
      10.1.1.8/30;
      192.168.26.0/24;
      192.168.42.0/24;
      192.168.68.0/24;
      192.168.73.0/24;
    };
    options {
      allow-transfer { cluster; secondaries; };
      allow-query { cluster; trusted; };
      allow-query-cache { cluster; trusted; };
      auth-nxdomain no;
      also-notify { 192.168.73.31; };
      blackhole { bad_networks; };
      directory "/var/cache/bind";
      dnssec-validation auto;
      forward first;
      forwarders {
        8.8.8.8;
      };
      listen-on { any; };
      listen-on-v6 { none; };
      notify yes;
    };
    zone "cummings-online.ca" {
      type primary;
      file "/etc/bind/db.cummings-online";
      allow-query { any; };
    };
    zone "11.10.in-addr.arpa" {
      type primary;
      file "/etc/bind/db.10.11";
      allow-query { any; };
    };
    zone "73.16.172.in-addr.arpa" {
      type primary;
      file "/etc/bind/db.172.16.73";
      allow-query { any; };
    };
    zone "168.192.in-addr.arpa" {
      type primary;
      file "/etc/bind/db.192.168";
      allow-query { any; };
    };
  db-cummings-online: |
    $TTL 86400
    @  IN    SOA   ns.cummings-online.ca. gmc.cummings-online.ca. (
      2026072701   ; serial
           86400   ; refresh
           28800   ; retry
          604800   ; expire
          86400 )  ; negative cache ttl

    ; Required nameserver records ----------------------------------------
    @           IN    NS    ns.cummings-online.ca.
    ns          IN    A     10.11.0.31

    ; MX records
    @            IN MX  1 aspmx.l.google.com.
    @            IN MX 10 alt4.aspmx.l.google.com.
    @            IN MX 10 alt3.aspmx.l.google.com.
    @            IN MX  5 alt1.aspmx.l.google.com.
    @            IN MX  5 alt2.aspmx.l.google.com.

    ; Hosts --------------------------------------------------------------
    @            IN A 172.66.0.96
    @            IN A 162.159.140.98
    bambu        IN	A	192.168.68.232
    brother      IN	A	192.168.68.61
    canon	       IN	A	192.168.73.61
    colour       IN A 192.168.68.62
    goemon       IN	A	192.168.68.73
    goliath      IN	A	192.168.73.13
    rpi1	       IN A	192.168.68.31
    rpi2 	       IN A	192.168.68.32
    rpi3         IN A	192.168.68.33
    rpi4         IN	A	192.168.68.34
    fujiko       IN	A	192.168.73.12
    gw-knw       IN	A	192.168.73.1
    jigen        IN A 10.11.0.3
    jigen-int    IN A 172.16.73.3
    knw-access   IN	A	192.168.73.43
    knw-ha       IN	A	192.168.73.41
    knw-jump     IN	A	192.168.73.42
    lupin        IN A 10.11.0.2
    lupin-int    IN A 172.16.73.2
    ns3          IN	A	192.168.73.31
    sanda        IN A 192.168.68.231
    spectre      IN	A	192.168.68.254
    uaaa         IN A 192.168.68.163
    userver      IN A 192.168.68.241
    zenigata     IN A 10.11.0.4
    zenigata-int IN A 172.16.73.4
    ingress1     IN A 10.11.0.10
    ldap         IN A 10.11.0.11
    krb5         IN A 10.11.0.12
    krb5r        IN A 10.11.0.13
    intranet     IN A 10.11.0.14

    nixoscache  IN CNAME lupin.cummings-online.ca.
    nfs         IN CNAME jigen.cummings-online.ca.
    time        IN CNAME lupin.cummings-online.ca.
    test        IN CNAME ingress1.cummings-online.ca.
  db-172-16-73: |
    $TTL 86400
    @ IN SOA ns.cummings-online.ca hostmaster.cummings-online.ca. (
     2026072701 ; serial
          86400 ; refresh
          28800 ; retry
         604800 ; expire
          86400 ; negative cache ttl
     )

    ; Required nameserver records ----------------------------------------
    @           IN    NS    ns.cummings-online.ca.
    ns          IN    A     10.11.0.31

    ; PTR --------------------------------------------------------------
    2   IN PTR lupin-int.cummings-online.ca.
    3   IN PTR jigen-int.cummings-online.ca.
    4   IN PTR zenigata-int.cummings-online.ca.
  db-192-168: |
    $TTL 86400
    @ IN SOA ns.cummings-online.ca hostmaster.cummings-online.ca. (
     2026072701 ; serial
          86400 ; refresh
          28800 ; retry
         604800 ; expire
          86400 ; negative cache ttl
     )

    ; Required nameserver records ----------------------------------------
    @           IN    NS    ns.cummings-online.local.
    ns          IN    A     10.11.0.31

    ; PTR --------------------------------------------------------------
    68.1    IN PTR gw-mtl.cummings-online.ca.
    68.61   IN PTR brother.cummings-online.ca.
    68.62   IN PTR colour.cummings-online.ca.
    68.31   IN PTR rpi1.cummings-online.ca.
    68.32   IN PTR rpi2.cummings-online.ca.
    68.33   IN PTR rpi3.cummings-online.ca.
    68.34   IN PTR rpi4.cummings-online.ca.
    68.73   IN PTR goemon.cummings-online.ca.
    68.163  IN PTR uaaa.cummings-online.ca.
    68.231  IN PTR sanda.cummings-online.ca.
    68.241  IN PTR userver.cummings-online.ca.
    68.232  IN PTR bambu.cummings-online.ca.
    68.254  IN PTR spectre.cummings-online.ca.
    73.1    IN PTR gw-knw.cummings-online.ca.
    73.12   IN PTR fujiko.cummings-online.ca.
    73.13   IN PTR goliath.cummings-online.ca.
    73.31   IN PTR ns3.cummings-online.ca.
    73.41   IN PTR knw-ha.cummings-online.ca.
    73.42   IN PTR knw-jump.cummings-online.ca.
    73.43   IN PTR knw-access.cummings-online.ca.
    73.61   IN PTR canon.cummings-online.ca.
  db-10-11: |
    $TTL 86400
    @ IN SOA ns.cummings-online.ca hostmaster.cummings-online.ca. (
      2026072701 ; serial
      86400 ; refresh
      28800 ; retry
      604800 ; expire
      86400 ; negative cache ttl
    )

    ; Required nameserver records ----------------------------------------
    @           IN    NS    ns.cummings-online.ca.
    ns          IN    A     10.11.0.31

    ; PTR --------------------------------------------------------------
    0.2  IN PTR lupin.cummings-online.ca.
    0.3  IN PTR jigen.cummings-online.ca.
    0.4  IN PTR zenigata.cummings-online.ca.
    0.10 IN PTR ingress1.cummings-online.ca.
    0.11 IN PTR ldap.cummings-online.ca.
    0.12 IN PTR krb5.cummings-online.ca.
    0.13 IN PTR krb5r.cummings-online.ca.
    0.14 IN PTR intranet.cummings-online.ca.
    0.31 IN PTR ns.cummings-online.ca.
