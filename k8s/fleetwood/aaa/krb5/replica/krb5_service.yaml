---
apiVersion: v1
kind: Service
metadata:
  name: krb-replica
  namespace: it
spec:
  selector:
    app: krb5-replica
  ports:
    - name: kerberos
      protocol: TCP
      port: 88
      targetPort: 88
    - name: kpasswd
      protocol: TCP
      port: 464
      targetPort: 464
    - name: kerberos-adm
      protocol: TCP
      port: 749
      targetPort: 749
    - name: krb5-prop
      protocol: TCP
      port: 754
      targetPort: 754
  type: LoadBalancer
  loadBalancerIP: 10.11.0.16
